<!doctype html>
<html lang="ar" dir="rtl">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>My Pet & Go - حقيبة حمل القطط</title>
        <link rel="stylesheet" href="styles.css" />
        <link
            href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"
            rel="stylesheet"
        />
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;900&display=swap"
            rel="stylesheet"
        />

    </head>
    <body>
        <!-- Floating Order Button -->
        <button id="floatingOrderBtn" class="floating-order-btn">
            <i class="fas fa-shopping-cart"></i>
            أطلب الآن
        </button>

        <!-- Main Content -->
        <main class="main-content">
            <div class="container">
                <!-- Product Banner Image -->
                <div class="product-banner">
                    <img src="attached_assets/Ad4)_1762300227681.webp" alt="My Pet & Go - حقيبة حمل القطط" class="banner-image" />
                </div>

                <!-- Order Form Section -->
                <div class="order-section" id="orderSection">
                    <div class="order-form">
                        <div class="form-header">
                            <i class="fas fa-shopping-cart"></i>
                            أضف معلوماتك للطلب
                        </div>

                        <form id="orderForm" class="order-form-content">
                            <div class="form-group">
                                <label for="fullName">
                                    <i class="fas fa-user"></i>
                                    الإسم بالكامل
                                </label>
                                <input
                                    type="text"
                                    id="fullName"
                                    name="fullName"
                                    required
                                    placeholder="أدخل اسمك الكامل"
                                />
                            </div>

                            <div class="form-group">
                                <label for="phone">
                                    <i class="fas fa-phone"></i>
                                    رقم الهاتف
                                </label>
                                <input
                                    type="tel"
                                    id="phone"
                                    name="phone"
                                    required
                                    placeholder="05xxxxxxxx"
                                />
                            </div>

                            <div class="form-row">
                                <div class="form-group">
                                    <label for="wilaya">
                                        <i class="fas fa-map-marker-alt"></i>
                                        الولاية
                                    </label>
                                    <select
                                        id="wilaya"
                                        name="wilaya"
                                        required
                                        onchange="handleWilayaChange()"
                                    >
                                        <option value="">اختر الولاية</option>
                                        <option value="Médéa">المدية</option>
                                        <option value="Blida">البليدة</option>
                                        <option value="Bouira">البويرة</option>
                                        <option value="Tiaret">تيارت</option>
                                        <option value="Alger">الجزائر</option>
                                        <option value="M'Sila">المسيلة</option>
                                        <option value="Tissemsilt">تيسمسيلت</option>
                                        <option value="Chlef">الشلف</option>
                                        <option value="Oum El Bouaghi">أم البواقي</option>
                                        <option value="Batna">باتنة</option>
                                        <option value="Béjaïa">بجاية</option>
                                        <option value="Tlemcen">تلمسان</option>
                                        <option value="Tizi Ouzou">تيزي وزو</option>
                                        <option value="Djelfa">الجلفة</option>
                                        <option value="Jijel">جيجل</option>
                                        <option value="Sétif">سطيف</option>
                                        <option value="Saïda">سعيدة</option>
                                        <option value="Skikda">سكيكدة</option>
                                        <option value="Sidi Bel Abbès">سيدي بلعباس</option>
                                        <option value="Annaba">عنابة</option>
                                        <option value="Guelma">قالمة</option>
                                        <option value="Constantine">قسنطينة</option>
                                        <option value="Mostaganem">مستغانم</option>
                                        <option value="Mascara">معسكر</option>
                                        <option value="Oran">وهران</option>
                                        <option value="Bordj Bou Arreridj">برج بوعريريج</option>
                                        <option value="Boumerdès">بومرداس</option>
                                        <option value="El Tarf">الطارف</option>
                                        <option value="Khenchela">خنشلة</option>
                                        <option value="Souk Ahras">سوق أهراس</option>
                                        <option value="Tipaza">تيبازة</option>
                                        <option value="Mila">ميلة</option>
                                        <option value="Aîn Defla">عين الدفلى</option>
                                        <option value="Aîn Témouchent">عين تموشنت</option>
                                        <option value="Relizane">غليزان</option>
                                        <option value="Laghouat">الأغواط</option>
                                        <option value="Biskra">بسكرة</option>
                                        <option value="Tébessa">تبسة</option>
                                        <option value="Ouargla">ورقلة</option>
                                        <option value="El Oued">الوادي</option>
                                        <option value="Ghardaïa">غرداية</option>
                                        <option value="Ouled Djellal">أولاد جلال</option>
                                        <option value="Touggourt">توقرت</option>
                                        <option value="El M'Ghair">المغير</option>
                                        <option value="El Menia">المنيعة</option>
                                        <option value="Adrar">أدرار</option>
                                        <option value="Béchar">بشار</option>
                                        <option value="El Bayadh">البيض</option>
                                        <option value="Naâma">النعامة</option>
                                        <option value="Timimoun">تيميمون</option>
                                        <option value="Bordj Badji Mokhtar">برج باجي مختار</option>
                                        <option value="Béni Abbès">بني عباس</option>
                                        <option value="Tamanrasset">تمنراست</option>
                                        <option value="Illizi">إليزي</option>
                                        <option value="Tindouf">تندوف</option>
                                        <option value="In Salah">إن صالح</option>
                                        <option value="In Guezzam">إن قزام</option>
                                        <option value="Djanet">جانت</option>
                                    </select>
                                </div>

                                <!-- Delivery Type Selection -->
                                <div
                                    class="form-group"
                                    id="deliveryTypeGroup"
                                    style="display: none"
                                >
                                    <label class="delivery-selection-label">
                                        <i class="fas fa-truck"></i>
                                        اختر نوع التوصيل:
                                    </label>
                                    <div class="delivery-options-container">
                                        <div
                                            class="delivery-option"
                                            data-type="home"
                                            onclick="selectDeliveryType(this)"
                                        >
                                            <i class="fas fa-home"></i>
                                            <span>المنزل</span>
                                        </div>
                                        <div
                                            class="delivery-option"
                                            data-type="office"
                                            onclick="selectDeliveryType(this)"
                                        >
                                            <i class="fas fa-building"></i>
                                            <span>المكتب</span>
                                        </div>
                                    </div>
                                    <div
                                        id="deliveryPrice"
                                        class="delivery-price-display"
                                    ></div>
                                </div>
                            </div>

                            <div class="form-group">
                                <label for="commune">
                                    <i class="fas fa-home"></i>
                                    البلدية
                                </label>
                                <input
                                    type="text"
                                    id="commune"
                                    name="commune"
                                    required
                                    placeholder="أدخل اسم البلدية"
                                />
                            </div>

                            <!-- Quantity Selection -->
                            <div class="quantity-section">
                                <label>الكمية:</label>
                                <div class="quantity-controls">
                                    <button
                                        type="button"
                                        class="qty-btn"
                                        onclick="changeQuantity(-1)"
                                    >
                                        -
                                    </button>
                                    <input
                                        type="number"
                                        id="quantity"
                                        name="quantity"
                                        value="1"
                                        min="1"
                                        readonly
                                    />
                                    <button
                                        type="button"
                                        class="qty-btn"
                                        onclick="changeQuantity(1)"
                                    >
                                        +
                                    </button>
                                </div>
                            </div>

                            <!-- Price Display -->
                            <div class="price-display">
                                <div class="price-row">
                                    <span>سعر المنتج:</span>
                                    <div class="price-values">
                                        <span class="original-price"><span id="originalPrice">3200</span> د.ج</span>
                                        <span class="current-price"><span id="currentPrice">2900</span> د.ج</span>
                                    </div>
                                </div>
                                <div class="price-row">
                                    <span>التوصيل:</span>
                                    <span class="delivery-cost" id="summaryDelivery">0 د.ج</span>
                                </div>
                                <div class="price-divider"></div>
                                <div class="price-total">
                                    <span>السعر الإجمالي:</span>
                                    <span class="total-amount"><span id="summaryTotal">2900</span> د.ج</span>
                                </div>
                            </div>

                            <button type="submit" class="submit-btn">
                                <i class="fas fa-check-circle"></i>
                                تأكيد الطلب الآن
                            </button>
                        </form>
                    </div>
                </div>
            </div>
        </main>

        <!-- Success/Error Messages -->
        <div id="messageModal" class="modal">
            <div class="modal-content">
                <span class="close" onclick="closeModal()">&times;</span>
                <div class="modal-icon" id="modalIcon"></div>
                <div id="modalMessage" class="modal-message"></div>
            </div>
        </div>

        <script src="script.js"></script>
    </body>
</html>
